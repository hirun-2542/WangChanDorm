<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>เมนูหอพักวังจันทร์</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-style: normal;
    font-weight: 400;
    src: url("../../src/worker/fonts/IBMPlexSansThai-Regular.ttf") format("truetype");
  }

  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-style: normal;
    font-weight: 700;
    src: url("../../src/worker/fonts/IBMPlexSansThai-Bold.ttf") format("truetype");
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
  }

  body {
    background-color: #ffffff;
    color: #0a0a0a;
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .menu {
    position: relative;
    width: 2500px;
    height: 1686px;
    background-color: #ffffff;
  }

  .quad {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 92px;
  }

  .q-reg {
    left: 0;
    top: 0;
    width: 1250px;
    height: 843px;
    background-color: #0a0a0a;
    color: #ffffff;
  }

  .q-slip {
    left: 1250px;
    top: 0;
    width: 1250px;
    height: 843px;
  }

  .q-bill {
    left: 0;
    top: 843px;
    width: 1250px;
    height: 843px;
  }

  .q-contact {
    left: 1250px;
    top: 843px;
    width: 1250px;
    height: 843px;
  }

  .rule-h {
    position: absolute;
    left: 1250px;
    top: 843px;
    width: 1250px;
    height: 1px;
    background-color: #e5e5e5;
  }

  .rule-v {
    position: absolute;
    left: 1250px;
    top: 844px;
    width: 1px;
    height: 842px;
    background-color: #e5e5e5;
  }

  .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 152px;
    height: 152px;
    margin-bottom: 54px;
    border-radius: 16px;
    background-color: #f5f5f5;
    color: #404040;
  }

  .q-reg .icon {
    background-color: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  .icon svg {
    display: block;
    width: 86px;
    height: 86px;
  }

  .label {
    font-size: 118px;
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: 0;
  }

  .accent {
    width: 108px;
    height: 8px;
    margin-top: 40px;
    border-radius: 9999px;
    background-color: #2563eb;
  }

  .support {
    margin-top: 30px;
    font-size: 58px;
    font-weight: 400;
    line-height: 1.3;
    color: #737373;
  }

  .q-reg .support {
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <main class="menu">
    <section class="quad q-reg">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.4" />
          <path d="M4.2 19.3v-1c0-2.6 2.4-4.1 4.8-4.1s4.8 1.5 4.8 4.1v1" />
          <path d="M18.6 8.1h3.9" />
          <path d="M20.55 6.15v3.9" />
        </svg>
      </div>
      <p class="label">ลงทะเบียนผู้เช่า</p>
      <div class="accent" aria-hidden="true"></div>
      <p class="support">กรอกชื่อ เบอร์โทร และห้องของท่าน</p>
    </section>

    <section class="quad q-slip">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.9v10.4" />
          <path d="M7.8 8 12 3.8 16.2 8" />
          <path d="M5.2 15.4v2.4a1.9 1.9 0 0 0 1.9 1.9h9.8a1.9 1.9 0 0 0 1.9-1.9v-2.4" />
        </svg>
      </div>
      <p class="label">ส่งสลิป</p>
      <p class="support">ส่งรูปสลิปโอนเงินในแชทนี้</p>
    </section>

    <section class="quad q-bill">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.2 4.6A1 1 0 0 1 8.2 3.6h7.6a1 1 0 0 1 1 1v15.6l-2.4-1.5-2.4 1.5-2.4-1.5-2.4 1.5z" />
          <path d="M9.6 8.6h4.8" />
          <path d="M9.6 12.2h4.8" />
        </svg>
      </div>
      <p class="label">บิลของฉัน</p>
      <p class="support">ดูสถานะบิลล่าสุดของห้องท่าน</p>
    </section>

    <section class="quad q-contact">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12.6a2.6 2.6 0 0 1-2.6 2.6H11l-4.6 3.4v-3.4H6.6A2.6 2.6 0 0 1 4 12.6V7.4a2.6 2.6 0 0 1 2.6-2.6h10.8A2.6 2.6 0 0 1 20 7.4z" />
          <circle cx="8.4" cy="10" r="0.95" fill="currentColor" stroke="none" />
          <circle cx="12" cy="10" r="0.95" fill="currentColor" stroke="none" />
          <circle cx="15.6" cy="10" r="0.95" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <p class="label">ติดต่อเจ้าของ</p>
      <p class="support">ติดต่อเจ้าของหอพัก</p>
    </section>

    <div class="rule-h" aria-hidden="true"></div>
    <div class="rule-v" aria-hidden="true"></div>
  </main>
</body>
</html>

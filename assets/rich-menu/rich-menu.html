<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>เมนูหอพักวังจันทร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1&display=swap" rel="stylesheet" />
<style>
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-style: normal;
    font-weight: 400;
    src: url("../../src/worker/fonts/IBMPlexSansThai-Regular.ttf") format("truetype");
  }

  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-style: normal;
    font-weight: 700;
    src: url("../../src/worker/fonts/IBMPlexSansThai-Bold.ttf") format("truetype");
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 2500px;
    height: 1686px;
    overflow: hidden;
  }

  body {
    background-color: #f4f4f5;
    color: #ffffff;
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .menu {
    position: relative;
    width: 2500px;
    height: 1686px;
    background-color: #f4f4f5;
  }

  .quad {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 1226px;
    height: 819px;
    padding: 0 70px;
    border-radius: 40px;
    color: #ffffff;
    text-align: center;
  }

  .q-reg {
    left: 12px;
    top: 12px;
    background-color: #1d4ed8;
  }

  .q-slip {
    left: 1262px;
    top: 12px;
    background-color: #15803d;
  }

  .q-bill {
    left: 12px;
    top: 855px;
    background-color: #b45309;
  }

  .q-contact {
    left: 1262px;
    top: 855px;
    background-color: #6d28d9;
  }

  .disc {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.18);
  }

  .glyph {
    display: block;
    font-family: "Material Symbols Rounded";
    font-size: 280px;
    font-weight: 400;
    font-variation-settings: "FILL" 1, "wght" 400, "opsz" 48;
    line-height: 1;
    color: #ffffff;
  }

  .label {
    margin-top: 46px;
    font-size: 155px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    color: #ffffff;
  }

  .hint {
    margin-top: 28px;
    font-size: 81px;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    color: #ffffff;
  }
</style>
</head>
<body>
  <main class="menu">
    <section class="quad q-reg">
      <div class="disc" aria-hidden="true"><span class="glyph">person_add</span></div>
      <p class="label">ลงทะเบียนผู้เช่า</p>
      <p class="hint">กรอกชื่อ เบอร์โทร และเลือกห้อง</p>
    </section>

    <section class="quad q-slip">
      <div class="disc" aria-hidden="true"><span class="glyph">add_photo_alternate</span></div>
      <p class="label">ส่งสลิป</p>
      <p class="hint">ถ่ายรูปสลิปส่งในแชทนี้</p>
    </section>

    <section class="quad q-bill">
      <div class="disc" aria-hidden="true"><span class="glyph">receipt_long</span></div>
      <p class="label">บิลของฉัน</p>
      <p class="hint">ดูยอดค้างชำระของห้องคุณ</p>
    </section>

    <section class="quad q-contact">
      <div class="disc" aria-hidden="true"><span class="glyph">support_agent</span></div>
      <p class="label">ติดต่อเจ้าของ</p>
      <p class="hint">สอบถามหรือแจ้งเรื่องกับเจ้าของ</p>
    </section>
  </main>
</body>
</html>
